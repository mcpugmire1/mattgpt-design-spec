name: Receive facts from source repo

on:
  repository_dispatch:
    types: [facts-updated]
  workflow_dispatch:
    inputs:
      facts_json:
        description: "Facts JSON for testing — paste contents of facts.json"
        required: true
        type: string

jobs:
  update-facts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write _data/facts.yml
        env:
          FACTS_JSON: ${{ github.event_name == 'workflow_dispatch' && inputs.facts_json || toJson(github.event.client_payload.facts) }}
        run: |
          mkdir -p _data
          python3 - <<'PYEOF'
          import json, os

          facts = json.loads(os.environ["FACTS_JSON"])
          lines = [
              "# Auto-generated by sync-facts workflow — do not edit manually.",
              "# Source: llm_portfolio_assistant/scripts/extract_facts.py",
              "",
          ]
          for key, value in facts.items():
              if isinstance(value, list):
                  lines.append(f"{key}:")
                  for item in value:
                      safe = str(item).replace('"', '\\"')
                      lines.append(f'  - "{safe}"')
              elif isinstance(value, str):
                  safe = value.replace('"', '\\"')
                  lines.append(f'{key}: "{safe}"')
              elif value is None:
                  lines.append(f"{key}:")
              else:
                  lines.append(f"{key}: {value}")

          with open("_data/facts.yml", "w") as f:
              f.write("\n".join(lines) + "\n")

          print(f"Wrote _data/facts.yml ({len(facts)} keys)")
          PYEOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/facts.yml
          git diff --cached --quiet && echo "No changes to commit" || \
            (git commit -m "chore: sync facts from source repo [skip ci]" && git push)
